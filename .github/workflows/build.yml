name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: pip install --upgrade buildozer cython

      - name: Build APK with Buildozer
        run: |
          # تجهيز إعدادات مبدئية لـ Buildozer لو لم تكن موجودة
          buildozer init || true
          sed -i 's/#requirements = python3,kivy/requirements = python3,telethon,aiohttp,pysocks/g' buildozer.spec
          sed -i 's/#package.name = myapp/package.name = tgdlapp/g' buildozer.spec
          sed -i 's/#package.domain = org.test/package.domain = com.tgdl/g' buildozer.spec
          
          # تشغيل البناء
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgdl-apk
          path: bin/*.apk
